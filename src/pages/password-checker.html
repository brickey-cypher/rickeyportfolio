<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Strength Checker</title>
</head>
<body>
  <h1>Password Strength Checker</h1>

  <input id="passwordInput" type="password" placeholder="Enter your password" />
  <button id="checkBtn">Check Strength</button>

  <div id="result" style="margin-top: 1em; font-weight: bold;"></div>

  <!-- JS goes just before closing body tag -->
  <script>
    async function checkPassword(password) {
      try {
        const response = await fetch('https://your-render-url.onrender.com/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const result = await response.json();
        return result;
      } catch (error) {
        console.error('Error checking password:', error);
        return null;
      }
    }

    document.getElementById('checkBtn').addEventListener('click', async () => {
      const password = document.getElementById('passwordInput').value;
      const resultDiv = document.getElementById('result');

      if (!password) {
        resultDiv.textContent = 'Please enter a password.';
        return;
      }

      resultDiv.textContent = 'Checking...';

      const result = await checkPassword(password);

      if (result) {
        resultDiv.textContent = result.summary;
      } else {
        resultDiv.textContent = 'Failed to check password strength.';
      }
    });
  </script>
</body>
</html>
